packages:
  - "packages/*"
allowBuilds:
  "@bufbuild/buf": true
  "@swc/core": true
  sharp: true
  unrs-resolver: true
overrides:
  # 1.12 no longer applies tsconfig `paths` through project references, which breaks
  # import-x/no-unresolved on the root solution tsconfig: https://github.com/unrs/unrs-resolver/issues/221
  unrs-resolver: 1.11.1
minimumReleaseAge: 0
